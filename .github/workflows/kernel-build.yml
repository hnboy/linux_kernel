name: Build Custom Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version, e.g. 7.2.9 (empty = latest stable)'
        required: false
        default: ''
      upload_release:
        description: 'Publish a GitHub Release'
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve kernel version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.kernel_version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION=$(echo "$INPUT_VERSION" | tr -d '[:space:]')
          else
            VERSION=$(curl -fsSL https://www.kernel.org/releases.json \
              | jq -r '[.releases[] | select(.moniker == "stable")][0].version')
          fi
          # makepkg pkgver allows only [0-9.] here; reject anything else early
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid kernel version '$VERSION'. Use the form 7.2.9 (no -suffix)."
            exit 1
          fi
          echo "Kernel version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: get-version
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      KVER: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git bc bison ccache flex cpio kmod libelf \
            ncurses openssl perl python rsync tar xz zstd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: |
          sed -i "s/^pkgver=.*/pkgver=${KVER}/" PKGBUILD
          grep '^pkgver=' PKGBUILD
          useradd -m builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/kernel

      - name: Restore kernel source tarball cache
        uses: actions/cache@v4
        with:
          path: /home/builder/kernel/linux-${{ env.KVER }}.tar.xz
          key: kernel-src-${{ env.KVER }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: ccache-${{ env.KVER }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.KVER }}-
            ccache-

      - name: Fix ownership
        run: |
          mkdir -p /home/builder/.ccache
          chown -R builder:builder /home/builder/kernel /home/builder/.ccache

      - name: Build packages with makepkg
        run: |
          runuser -u builder -- bash -c 'cd /home/builder/kernel && makepkg --noconfirm --nodeps'

      - name: Collect packages
        run: |
          mkdir -p output
          cp /home/builder/kernel/*.pkg.tar.zst output/
          ls -lh output/
          test "$(ls output/*.pkg.tar.zst | wc -l)" -eq 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-custom-${{ env.KVER }}
          path: output/*.pkg.tar.zst
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.upload_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KVER }}
          name: Custom Kernel ${{ env.KVER }}
          files: output/*.pkg.tar.zst
          body: |
            Custom Arch Linux kernel ${{ env.KVER }} (linux-custom + linux-custom-headers).

            Install with scripts/install.sh, or manually:
            sudo pacman -U linux-custom-${{ env.KVER }}-1-x86_64.pkg.tar.zst linux-custom-headers-${{ env.KVER }}-1-x86_64.pkg.tar.zst
            sudo mkinitcpio -p linux-custom
